<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Inventario en Línea</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ============ Cabecera ============ -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-icon">📦</span>
        <span>Inventario&nbsp;Online</span>
      </a>
      <nav class="header-actions">
        <a class="btn btn-ghost btn-sm" href="index.html">← Volver al inicio</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">🔐</div>
      <h1>Iniciar sesión</h1>
      <p class="subtitle">Ingresa tus credenciales para acceder al panel de administración.</p>

      <div id="auth-alert" class="alert" hidden></div>

      <form id="auth-form" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Iniciar sesión</button>
      </form>
    </div>
  </main>

  <!-- ============ Firebase (compat) ============ -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
